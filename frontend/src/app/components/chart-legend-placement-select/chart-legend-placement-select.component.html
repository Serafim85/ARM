@if (inline()) {
  <div
    class="chart-toolbar-control chart-legend-placement-inline"
    role="listbox"
    [attr.aria-label]="ariaLabelledBy() ? undefined : 'Расположение легенды'"
    [attr.aria-labelledby]="ariaLabelledBy()"
  >
    @for (option of options; track option.value) {
      <button
        type="button"
        class="chart-toolbar-control__btn"
        role="option"
        [class.is-selected]="placement() === option.value"
        [attr.aria-selected]="placement() === option.value"
        [attr.aria-label]="option.label"
        [title]="option.label"
        (click)="selectPlacement(option.value)"
      >
        <span [class]="iconClass(option.value)" aria-hidden="true">
          <span class="chart-legend-placement-icon__chart"></span>
          <span class="chart-legend-placement-icon__dot"></span>
        </span>
      </button>
    }
  </div>
} @else {
  <button
    type="button"
    class="chart-toolbar-control__btn"
    (click)="placementPopover.toggle($event)"
    [attr.aria-labelledby]="ariaLabelledBy()"
    [attr.aria-label]="currentPlacementLabel()"
    aria-haspopup="listbox"
    [title]="currentPlacementLabel()"
  >
    <span [class]="iconClass(placement())" aria-hidden="true">
      <span class="chart-legend-placement-icon__chart"></span>
      <span class="chart-legend-placement-icon__dot"></span>
    </span>
  </button>

  <p-popover
    #placementPopover
    appendTo="body"
    styleClass="chart-toolbar-control-popover"
  >
    <div class="chart-toolbar-control-menu" role="listbox" [attr.aria-label]="'Расположение легенды'">
      @for (option of options; track option.value) {
        <button
          type="button"
          class="chart-toolbar-control__btn"
          role="option"
          [class.is-selected]="placement() === option.value"
          [attr.aria-selected]="placement() === option.value"
          [attr.aria-label]="option.label"
          [title]="option.label"
          (click)="selectPlacement(option.value)"
        >
          <span [class]="iconClass(option.value)" aria-hidden="true">
            <span class="chart-legend-placement-icon__chart"></span>
            <span class="chart-legend-placement-icon__dot"></span>
          </span>
        </button>
      }
    </div>
  </p-popover>
}

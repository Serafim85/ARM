<svg xmlns="http://www.w3.org/2000/svg" width="144" height="40" viewBox="0 0 72 20" role="img" aria-labelledby="title desc">
    <title id="title">wiSLA logo for dark background</title>
    <desc id="desc">Refined wiSLA wordmark with cool metallic blue gradient and glowing red accent dot, optimized for dark UI themes.</desc>

    <defs>
        <linearGradient id="wordFill" x1="0" y1="0" x2="72" y2="20" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="24%" stop-color="#CBD5E1"/>
            <stop offset="58%" stop-color="#93C5FD"/>
            <stop offset="100%" stop-color="#64748B"/>
        </linearGradient>

        <linearGradient id="wordShine" x1="0" y1="0" x2="0" y2="20" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="rgba(255,255,255,0.50)"/>
            <stop offset="45%" stop-color="rgba(255,255,255,0.12)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>

        <radialGradient id="dotFill" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#FFB4A8"/>
            <stop offset="42%" stop-color="#FF6B5A"/>
            <stop offset="100%" stop-color="#D83A2B"/>
        </radialGradient>

        <filter id="wordShadow" x="-20%" y="-40%" width="140%" height="200%" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="0.65" stdDeviation="0.45" flood-color="#000000" flood-opacity="0.45"/>
            <feDropShadow dx="0" dy="0" stdDeviation="0.55" flood-color="#60A5FA" flood-opacity="0.12"/>
        </filter>

        <filter id="dotGlow" x="-200%" y="-200%" width="400%" height="400%" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="0" stdDeviation="0.65" flood-color="#FF6B5A" flood-opacity="0.85"/>
            <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#FF6B5A" flood-opacity="0.28"/>
        </filter>


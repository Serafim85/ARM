<button
  type="button"
  class="chart-toolbar-control__btn"
  (click)="colorPopover.toggle($event)"
  [attr.aria-labelledby]="ariaLabelledBy()"
  [attr.aria-label]="currentColorLabel()"
  aria-haspopup="listbox"
  [title]="currentColorLabel()"
>
  <span class="chart-base-color-swatch" [style.background-color]="color()" aria-hidden="true"></span>
</button>

<p-popover
  #colorPopover
  appendTo="body"
  styleClass="chart-toolbar-control-popover"
>
  <div class="chart-toolbar-control-menu" role="listbox" aria-label="Базовый цвет графика">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="chart-toolbar-control__btn"
        role="option"
        [class.is-selected]="color() === option.value"
        [attr.aria-selected]="color() === option.value"
        [attr.aria-label]="option.label"
        [title]="option.label"
        (click)="selectColor(option.value)"
      >
        <span class="chart-base-color-swatch" [style.background-color]="option.value" aria-hidden="true"></span>
      </button>
    }
  </div>
</p-popover>

monitoring.collector.enabled=false
monitoring.kafka.enabled=true
monitoring.kafka.evaluator-enabled=true
monitoring.kafka.writer-enabled=false

# Evaluator role: CPU-heavy trigger evaluation, prefer steady poll cadence.
monitoring.kafka.listener-concurrency=${MONITORING_KAFKA_LISTENER_CONCURRENCY:6}
spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:500}
spring.kafka.consumer.properties.fetch.min.bytes=${KAFKA_FETCH_MIN_BYTES:262144}
spring.kafka.consumer.properties.fetch.max.wait.ms=${KAFKA_FETCH_MAX_WAIT_MS:200}
spring.kafka.consumer.properties.max.partition.fetch.bytes=${KAFKA_MAX_PARTITION_FETCH_BYTES:4194304}
spring.kafka.consumer.properties.max.poll.interval.ms=${KAFKA_MAX_POLL_INTERVAL_MS:300000}
spring.kafka.consumer.properties.session.timeout.ms=${KAFKA_SESSION_TIMEOUT_MS:30000}
spring.kafka.consumer.properties.heartbeat.interval.ms=${KAFKA_HEARTBEAT_INTERVAL_MS:10000}
spring.kafka.listener.poll-timeout=${KAFKA_LISTENER_POLL_TIMEOUT_MS:1200}

spring.datasource.hikari.maximum-pool-size=${DB_HIKARI_MAX_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_HIKARI_MIN_IDLE:10}

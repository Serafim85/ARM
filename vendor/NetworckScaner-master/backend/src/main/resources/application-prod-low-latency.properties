# Profile "prod-low-latency": prioritize lower end-to-end delay over peak throughput.
# Activate together with prod, e.g.:
#   SPRING_PROFILES_ACTIVE=prod,prod-low-latency
#
# Main effect:
# - Faster delivery of individual events/batches.
# - More network requests and lower compression efficiency.

monitoring.kafka.listener-concurrency=${MONITORING_KAFKA_LISTENER_CONCURRENCY:8}
monitoring.kafka.publisher.send-timeout-ms=${MONITORING_KAFKA_PUBLISHER_SEND_TIMEOUT_MS:1200}

spring.kafka.producer.batch-size=${KAFKA_BATCH_SIZE:32768}
spring.kafka.producer.properties.linger.ms=${KAFKA_LINGER_MS:5}
spring.kafka.producer.compression-type=${KAFKA_COMPRESSION_TYPE:lz4}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:4000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:10000}

spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:300}
spring.kafka.consumer.properties.fetch.min.bytes=${KAFKA_FETCH_MIN_BYTES:1}
spring.kafka.consumer.properties.fetch.max.wait.ms=${KAFKA_FETCH_MAX_WAIT_MS:100}
spring.kafka.listener.poll-timeout=${KAFKA_LISTENER_POLL_TIMEOUT_MS:800}

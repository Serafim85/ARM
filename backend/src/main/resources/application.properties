spring.application.name=backend
# Релиз для UI без Maven build-info (IDEA). Должен совпадать с app.release.version в pom.xml.
app.release.version=1.0.0
# Фон слоя топологии (GROUP): загрузка PNG/JPEG/SVG
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Загрузка демо-данных с экрана входа (POST /api/debug/demo-monitoring-seed). Профиль prod выключает демо и публичный Swagger по умолчанию (см. application-prod.properties).
app.demo-monitoring-seed-enabled=true
app.integration.source-system=${APP_INTEGRATION_SOURCE_SYSTEM:}
app.integration.wisla-events.enabled=${APP_INTEGRATION_WISLA_EVENTS_ENABLED:true}
app.integration.wisla-events.availability-heartbeat-enabled=${APP_INTEGRATION_WISLA_EVENTS_AVAILABILITY_HEARTBEAT_ENABLED:true}
app.integration.wisla-events.availability-heartbeat-ms=${APP_INTEGRATION_WISLA_EVENTS_AVAILABILITY_HEARTBEAT_MS:300000}
app.integration.wisla.kafka-broker-metadata-path=${APP_INTEGRATION_WISLA_KAFKA_BROKER_METADATA_PATH:/api/wisla/kafka-broker-metadata}
app.integration.wisla.kafka-broker-security.security-protocol=${APP_INTEGRATION_WISLA_KAFKA_SECURITY_PROTOCOL:}
app.integration.wisla.kafka-broker-security.sasl-mechanism=${APP_INTEGRATION_WISLA_KAFKA_SASL_MECHANISM:}
app.integration.wisla.kafka-broker-security.sasl-jaas-config=${APP_INTEGRATION_WISLA_KAFKA_SASL_JAAS_CONFIG:}
app.integration.wisla.kafka-broker-security.ssl-truststore-location=${APP_INTEGRATION_WISLA_KAFKA_SSL_TRUSTSTORE_LOCATION:}
app.integration.wisla.kafka-broker-security.ssl-truststore-password=${APP_INTEGRATION_WISLA_KAFKA_SSL_TRUSTSTORE_PASSWORD:}
app.integration.wisla.kafka-broker-security.ssl-keystore-location=${APP_INTEGRATION_WISLA_KAFKA_SSL_KEYSTORE_LOCATION:}
app.integration.wisla.kafka-broker-security.ssl-keystore-password=${APP_INTEGRATION_WISLA_KAFKA_SSL_KEYSTORE_PASSWORD:}
app.integration.wisla.kafka-broker-security.ssl-key-password=${APP_INTEGRATION_WISLA_KAFKA_SSL_KEY_PASSWORD:}
debug.mode=${DEBUG_MODE:false}
# CORS: URL фронтенда в браузере; несколько значений через запятую. Для nginx укажите внешний URL (например https://host.example).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
server.port=8081

# OpenAPI / Swagger UI: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/networkscanner}
spring.datasource.username=${DB_USERNAME:networkscanner}
spring.datasource.password=${DB_PASSWORD:networkscanner}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5435/networkscanner}
spring.flyway.user=${DB_USERNAME:networkscanner}
spring.flyway.password=${DB_PASSWORD:networkscanner}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
jwt.secret=${JWT_SECRET:networkscanner-super-secret-jwt-key-2026-networkscanner}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}
monitoring.collect-interval-ms=${MONITORING_COLLECT_INTERVAL_MS:60000}
monitoring.collector-threads=${MONITORING_COLLECTOR_THREADS:10}
monitoring.collector.per-device-timeout-ms=${MONITORING_COLLECTOR_PER_DEVICE_TIMEOUT_MS:30000}
monitoring.collector.pre-snmp-icmp.enabled=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_ENABLED:true}
monitoring.collector.pre-snmp-icmp.timeout-ms=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_TIMEOUT_MS:3000}
monitoring.collector.pre-snmp-icmp.threads=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_THREADS:${MONITORING_COLLECTOR_THREADS:10}}
monitoring.collector.pre-snmp-icmp.fail-policy=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_FAIL_POLICY:snmp_probe}
monitoring.collector.pre-snmp-snmp-probe.timeout-ms=${MONITORING_COLLECTOR_PRE_SNMP_SNMP_PROBE_TIMEOUT_MS:1500}
monitoring.collector.lightweight.per-device-timeout-ms=${MONITORING_COLLECTOR_LIGHTWEIGHT_PER_DEVICE_TIMEOUT_MS:8000}
monitoring.collector.enabled=${MONITORING_COLLECTOR_ENABLED:true}
monitoring.availability-refresh.enabled=${MONITORING_AVAILABILITY_REFRESH_ENABLED:true}
monitoring.availability-refresh.interval-ms=${MONITORING_AVAILABILITY_REFRESH_INTERVAL_MS:60000}
monitoring.availability-refresh.threads=${MONITORING_AVAILABILITY_REFRESH_THREADS:16}
monitoring.availability-refresh.network-timeout-ms=${MONITORING_AVAILABILITY_REFRESH_NETWORK_TIMEOUT_MS:2000}
monitoring.availability-refresh.per-device-timeout-ms=${MONITORING_AVAILABILITY_REFRESH_PER_DEVICE_TIMEOUT_MS:8000}
monitoring.availability-refresh.batch-size=${MONITORING_AVAILABILITY_REFRESH_BATCH_SIZE:100}
monitoring.availability-refresh.state-heartbeat-ms=${MONITORING_AVAILABILITY_REFRESH_STATE_HEARTBEAT_MS:300000}
monitoring.availability-refresh.history-down-sample-ms=${MONITORING_AVAILABILITY_REFRESH_HISTORY_DOWN_SAMPLE_MS:180000}
monitoring.icmp.attempts=${MONITORING_ICMP_ATTEMPTS:3}
monitoring.icmp.timeout-ms=${MONITORING_ICMP_TIMEOUT_MS:1000}
monitoring.system-template-dirs=${MONITORING_SYSTEM_TEMPLATE_DIRS:monitoring-templates}
monitoring.system-template-classpath-fallback=${MONITORING_SYSTEM_TEMPLATE_CLASSPATH_FALLBACK:true}
# Donor module ids (classpath monitoring-templates/modules/*.template) merged into every SNMP template macro catalog.
monitoring.default-macro-donors=${MONITORING_DEFAULT_MACRO_DONORS:generic-snmp-macros,vfs-fs-macros,icmp-ping-macros}
# Graal JS preprocessing: Polyglot Engine+Context on one worker. Soft reset (0=off) re-creates Engine+Context after N successful evals and interval.
monitoring.js.engine-soft-reset-interval-ms=${MONITORING_JS_ENGINE_SOFT_RESET_INTERVAL_MS:0}
monitoring.js.engine-soft-reset-min-evaluations=${MONITORING_JS_ENGINE_SOFT_RESET_MIN_EVALUATIONS:50000}
monitoring.kafka.enabled=${MONITORING_KAFKA_ENABLED:true}
monitoring.kafka.evaluator-enabled=${MONITORING_KAFKA_EVALUATOR_ENABLED:true}
monitoring.kafka.writer-enabled=${MONITORING_KAFKA_WRITER_ENABLED:true}
monitoring.kafka.partitions=${MONITORING_KAFKA_PARTITIONS:6}
monitoring.kafka.replication-factor=${MONITORING_KAFKA_REPLICATION_FACTOR:1}
monitoring.kafka.listener-concurrency=${MONITORING_KAFKA_LISTENER_CONCURRENCY:3}
monitoring.kafka.publisher.send-timeout-ms=${MONITORING_KAFKA_PUBLISHER_SEND_TIMEOUT_MS:2000}
monitoring.kafka.max-message-bytes=${MONITORING_KAFKA_MAX_MESSAGE_BYTES:2097152}
monitoring.kafka.publisher.max-record-bytes=${MONITORING_KAFKA_PUBLISHER_MAX_RECORD_BYTES:1900000}
monitoring.kafka.topics.polled=${MONITORING_KAFKA_POLLED_TOPIC:monitoring.polled}
monitoring.kafka.topics.evaluated=${MONITORING_KAFKA_EVALUATED_TOPIC:monitoring.evaluated}
monitoring.kafka.topics.wisla-availability=${MONITORING_KAFKA_WISLA_AVAILABILITY_TOPIC:wisla.availability}
monitoring.kafka.topics.wisla-incidents=${MONITORING_KAFKA_WISLA_INCIDENTS_TOPIC:wisla.incidents}
monitoring.kafka.topics.wisla-monitor-state-snapshot=${MONITORING_KAFKA_WISLA_MONITOR_STATE_SNAPSHOT_TOPIC:wisla.monitor-state}
monitoring.kafka.monitor-state-snapshot.retention-bytes=${MONITORING_KAFKA_WISLA_MONITOR_STATE_SNAPSHOT_RETENTION_BYTES:1073741824}
monitoring.kafka.monitor-state-snapshot.retention-ms=${MONITORING_KAFKA_WISLA_MONITOR_STATE_SNAPSHOT_RETENTION_MS:1209600000}
monitoring.kafka.groups.evaluator=${MONITORING_KAFKA_EVALUATOR_GROUP:cg_eval}
monitoring.kafka.groups.writer=${MONITORING_KAFKA_WRITER_GROUP:cg_writer}
monitoring.kafka.cache.max-devices=${MONITORING_KAFKA_CACHE_MAX_DEVICES:10000}
monitoring.kafka.cache.expire-after-minutes=${MONITORING_KAFKA_CACHE_EXPIRE_AFTER_MINUTES:30}
monitoring.trigger-engine.extended-functions-enabled=${MONITORING_TRIGGER_ENGINE_EXTENDED_FUNCTIONS_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.admin.auto-create=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:3}
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:10000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:20000}
spring.kafka.producer.compression-type=${KAFKA_COMPRESSION_TYPE:lz4}
spring.kafka.producer.batch-size=${KAFKA_BATCH_SIZE:65536}
spring.kafka.producer.properties.linger.ms=${KAFKA_LINGER_MS:20}
spring.kafka.producer.properties.max.request.size=${KAFKA_MAX_REQUEST_SIZE:2097152}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:100}
spring.kafka.consumer.properties.fetch.min.bytes=${KAFKA_FETCH_MIN_BYTES:1}
spring.kafka.consumer.properties.fetch.max.bytes=${KAFKA_FETCH_MAX_BYTES:4194304}
spring.kafka.consumer.properties.max.partition.fetch.bytes=${KAFKA_MAX_PARTITION_FETCH_BYTES:4194304}
spring.kafka.consumer.properties.fetch.max.wait.ms=${KAFKA_FETCH_MAX_WAIT_MS:500}

#
# Logging (SLF4J + Logback). Configurable via logback-spring.xml placeholders.
#
# Log files:
# - primary keys (new): app.logging.file.path, app.logging.file.name
# - backward-compatible fallbacks: app.logging.dir, app.logging.file
app.logging.file.path=${APP_LOGGING_FILE_PATH:./logs}
app.logging.file.name=${APP_LOGGING_FILE_NAME:${spring.application.name}.log}

# Rolling policy (daily + size)
app.logging.rolling.max-file-size=${APP_LOGGING_ROLLING_MAX_FILE_SIZE:10MB}
app.logging.rolling.max-history-days=${APP_LOGGING_ROLLING_MAX_HISTORY_DAYS:14}
app.logging.rolling.total-size-cap=${APP_LOGGING_ROLLING_TOTAL_SIZE_CAP:2GB}

# Log levels (standard Spring Boot keys)
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.apache.kafka=${LOGGING_LEVEL_KAFKA:WARN}
logging.level.org.springframework.kafka=${LOGGING_LEVEL_SPRING_KAFKA:WARN}

# Examples:
# Enable DEBUG for a package
logging.level.com.networkscanner.backend.monitoring=${LOGGING_LEVEL_MONITORING:INFO}
# Enable TRACE for a конкретный класс
logging.level.com.networkscanner.backend.network.scan.impl.SnmpScanServiceImpl=${LOGGING_LEVEL_SNMP_SCAN_SERVICE:INFO}

# Пулы сканирования: ручные и автосканы изолированы (subnet-scan-* + scan-run-* + семафоры).
network.scan.manual.subnet-executor.core-pool-size=${NETWORK_SCAN_MANUAL_SUBNET_EXECUTOR_CORE:12}
network.scan.manual.subnet-executor.max-pool-size=${NETWORK_SCAN_MANUAL_SUBNET_EXECUTOR_MAX:24}
network.scan.manual.subnet-executor.queue-capacity=${NETWORK_SCAN_MANUAL_SUBNET_EXECUTOR_QUEUE:1024}
network.scan.manual.max-concurrent-subnet-scans=${NETWORK_SCAN_MANUAL_MAX_CONCURRENT_SUBNET_SCANS:2}
network.scan.manual.run-executor.core-pool-size=${NETWORK_SCAN_MANUAL_RUN_EXECUTOR_CORE:2}
network.scan.manual.run-executor.max-pool-size=${NETWORK_SCAN_MANUAL_RUN_EXECUTOR_MAX:4}
network.scan.manual.run-executor.queue-capacity=${NETWORK_SCAN_MANUAL_RUN_EXECUTOR_QUEUE:32}
network.scan.job.subnet-executor.core-pool-size=${NETWORK_SCAN_JOB_SUBNET_EXECUTOR_CORE:16}
network.scan.job.subnet-executor.max-pool-size=${NETWORK_SCAN_JOB_SUBNET_EXECUTOR_MAX:48}
network.scan.job.subnet-executor.queue-capacity=${NETWORK_SCAN_JOB_SUBNET_EXECUTOR_QUEUE:2048}
network.scan.job.max-concurrent-subnet-scans=${NETWORK_SCAN_JOB_MAX_CONCURRENT_SUBNET_SCANS:4}
network.scan.job.run-executor.core-pool-size=${NETWORK_SCAN_JOB_RUN_EXECUTOR_CORE:4}
network.scan.job.run-executor.max-pool-size=${NETWORK_SCAN_JOB_RUN_EXECUTOR_MAX:8}
network.scan.job.run-executor.queue-capacity=${NETWORK_SCAN_JOB_RUN_EXECUTOR_QUEUE:64}
network.scan.invoke-batch-size=${NETWORK_SCAN_INVOKE_BATCH_SIZE:256}
# Потоки планировщика CRON для задач автосканирования (только диспетчеризация; само сканирование — network.scan.*).
scan.jobs.scheduler.pool-size=${SCAN_JOBS_SCHEDULER_POOL_SIZE:8}

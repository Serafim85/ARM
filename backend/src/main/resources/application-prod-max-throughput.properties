# Profile "prod-max-throughput": prioritize sustained throughput over per-message latency.
# Activate together with prod, e.g.:
#   SPRING_PROFILES_ACTIVE=prod,prod-max-throughput
#
# Main effect:
# - Higher throughput and fewer broker round-trips.
# - Larger batching delay for some events.

monitoring.kafka.listener-concurrency=${MONITORING_KAFKA_LISTENER_CONCURRENCY:6}
monitoring.kafka.publisher.send-timeout-ms=${MONITORING_KAFKA_PUBLISHER_SEND_TIMEOUT_MS:2000}

spring.kafka.producer.batch-size=${KAFKA_BATCH_SIZE:262144}
spring.kafka.producer.properties.linger.ms=${KAFKA_LINGER_MS:40}
spring.kafka.producer.compression-type=${KAFKA_COMPRESSION_TYPE:zstd}
spring.kafka.producer.properties.buffer.memory=${KAFKA_BUFFER_MEMORY:268435456}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:8000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:20000}

spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:2000}
spring.kafka.consumer.properties.fetch.min.bytes=${KAFKA_FETCH_MIN_BYTES:4194304}
spring.kafka.consumer.properties.fetch.max.wait.ms=${KAFKA_FETCH_MAX_WAIT_MS:400}
spring.kafka.consumer.properties.max.partition.fetch.bytes=${KAFKA_MAX_PARTITION_FETCH_BYTES:8388608}
spring.kafka.listener.poll-timeout=${KAFKA_LISTENER_POLL_TIMEOUT_MS:2000}

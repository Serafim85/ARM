monitoring.collector.enabled=true
monitoring.kafka.enabled=true
monitoring.kafka.evaluator-enabled=false
monitoring.kafka.writer-enabled=false

# Collector role: produce polled events fast, avoid backlog growth.
monitoring.collector-threads=${MONITORING_COLLECTOR_THREADS:96}
# SNMP v3 + many walks on Linux template can exceed 12s; align with default application.properties (60s).
monitoring.collector.per-device-timeout-ms=${MONITORING_COLLECTOR_PER_DEVICE_TIMEOUT_MS:60000}
monitoring.collector.pre-snmp-icmp.enabled=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_ENABLED:true}
monitoring.collector.pre-snmp-icmp.timeout-ms=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_TIMEOUT_MS:3000}
monitoring.collector.pre-snmp-icmp.threads=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_THREADS:${MONITORING_COLLECTOR_THREADS:96}}
monitoring.collector.pre-snmp-icmp.fail-policy=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_FAIL_POLICY:snmp_probe}
monitoring.collector.pre-snmp-snmp-probe.timeout-ms=${MONITORING_COLLECTOR_PRE_SNMP_SNMP_PROBE_TIMEOUT_MS:1500}
monitoring.collector.lightweight.per-device-timeout-ms=${MONITORING_COLLECTOR_LIGHTWEIGHT_PER_DEVICE_TIMEOUT_MS:8000}
# Pool size should cover concurrent DB work from collector threads (see monitoring.collector-threads) plus headroom.
spring.datasource.hikari.maximum-pool-size=${DB_HIKARI_MAX_POOL_SIZE:128}
monitoring.kafka.publisher.send-timeout-ms=${MONITORING_KAFKA_PUBLISHER_SEND_TIMEOUT_MS:1500}

spring.kafka.producer.compression-type=${KAFKA_COMPRESSION_TYPE:lz4}
spring.kafka.producer.batch-size=${KAFKA_BATCH_SIZE:131072}
spring.kafka.producer.properties.linger.ms=${KAFKA_LINGER_MS:20}
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:2}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:12000}

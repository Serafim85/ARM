# WISLA ARM — Spring profile (fork NetworckScaner)
# Run: mvn spring-boot:run -Dspring-boot.run.profiles=wisla-arm
# Or: SPRING_PROFILES_ACTIVE=wisla-arm java -jar target/backend-*.jar

spring.application.name=wisla-arm-backend

# Database (MVP) — matches infra/docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/wisla_arm}
spring.datasource.username=${DB_USERNAME:wisla_arm}
spring.datasource.password=${DB_PASSWORD:wisla_arm}
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5435/wisla_arm}
spring.flyway.user=${DB_USERNAME:wisla_arm}
spring.flyway.password=${DB_PASSWORD:wisla_arm}

server.port=${SERVER_PORT:8081}

# MVP: no WISLA Kafka bridge yet (ADR-007)
app.integration.wisla-events.enabled=false

# MVP: SNMP/network collector off until ARM agent ingest is wired
monitoring.collector.enabled=false
monitoring.availability-refresh.enabled=false
monitoring.kafka.enabled=false
monitoring.kafka.evaluator-enabled=false
monitoring.kafka.writer-enabled=false

# ARM templates (future: templates/ mounted or copied to monitoring-templates)
monitoring.system-template-dirs=${MONITORING_SYSTEM_TEMPLATE_DIRS:monitoring-templates,templates}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Demo seed useful for local UI smoke until agent ingest exists
app.demo-monitoring-seed-enabled=true

# Agent ingest (MVP shared key — replace in production)
app.agent.ingest-api-key=${AGENT_INGEST_API_KEY:dev-arm-ingest-key}

# Offline if no ingest heartbeat within N minutes (REQ-2.5)
app.workstation.offline-threshold-minutes=${WORKSTATION_OFFLINE_THRESHOLD_MINUTES:10}

# ARM workstation alerts (threshold evaluation after agent ingest)
app.workstation.alerts.enabled=${WORKSTATION_ALERTS_ENABLED:true}
app.workstation.alerts.offline-check-interval-ms=${WORKSTATION_OFFLINE_CHECK_MS:120000}

# Telegram operator notifications (chat id stored in subscription recipientEmail)
app.telegram.enabled=${TELEGRAM_ENABLED:false}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}

# Profile "prod": safer defaults for deployment (activate with SPRING_PROFILES_ACTIVE=prod).
# Demo seed and public API docs are off unless overridden via environment.
#
# Optional performance overlays (activate together with "prod"):
# - prod-low-latency: lower Kafka end-to-end latency, lower peak throughput.
# - prod-max-throughput: higher Kafka throughput, higher batching latency.
# Examples:
#   SPRING_PROFILES_ACTIVE=prod,prod-low-latency
#   SPRING_PROFILES_ACTIVE=prod,prod-max-throughput

app.demo-monitoring-seed-enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Monitoring runtime (1000+ devices baseline)
monitoring.collect-interval-ms=${MONITORING_COLLECT_INTERVAL_MS:60000}
# Collector tuning: 96 threads is a good balance between CPU and I/O.
monitoring.collector-threads=${MONITORING_COLLECTOR_THREADS:12}
monitoring.collector.per-device-timeout-ms=${MONITORING_COLLECTOR_PER_DEVICE_TIMEOUT_MS:60000}
monitoring.collector.pre-snmp-icmp.enabled=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_ENABLED:true}
monitoring.collector.pre-snmp-icmp.timeout-ms=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_TIMEOUT_MS:3000}
monitoring.collector.pre-snmp-icmp.threads=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_THREADS:${MONITORING_COLLECTOR_THREADS:12}}
monitoring.collector.pre-snmp-icmp.fail-policy=${MONITORING_COLLECTOR_PRE_SNMP_ICMP_FAIL_POLICY:snmp_probe}
monitoring.collector.pre-snmp-snmp-probe.timeout-ms=${MONITORING_COLLECTOR_PRE_SNMP_SNMP_PROBE_TIMEOUT_MS:1500}
monitoring.collector.lightweight.per-device-timeout-ms=${MONITORING_COLLECTOR_LIGHTWEIGHT_PER_DEVICE_TIMEOUT_MS:8000}
# When collector runs in-process, pool must not be far below collector thread count (avoid 54s pool timeouts under load).
spring.datasource.hikari.maximum-pool-size=${DB_HIKARI_MAX_POOL_SIZE:128}

monitoring.availability-refresh.interval-ms=${MONITORING_AVAILABILITY_REFRESH_INTERVAL_MS:60000}
# Availability refresh tuning: 128 threads is a good balance between CPU and I/O.
monitoring.availability-refresh.threads=${MONITORING_AVAILABILITY_REFRESH_THREADS:16}
monitoring.availability-refresh.network-timeout-ms=${MONITORING_AVAILABILITY_REFRESH_NETWORK_TIMEOUT_MS:1500}
monitoring.availability-refresh.per-device-timeout-ms=${MONITORING_AVAILABILITY_REFRESH_PER_DEVICE_TIMEOUT_MS:3000}
monitoring.availability-refresh.batch-size=${MONITORING_AVAILABILITY_REFRESH_BATCH_SIZE:500}
monitoring.availability-refresh.state-heartbeat-ms=${MONITORING_AVAILABILITY_REFRESH_STATE_HEARTBEAT_MS:300000}
monitoring.availability-refresh.history-down-sample-ms=${MONITORING_AVAILABILITY_REFRESH_HISTORY_DOWN_SAMPLE_MS:600000}

app.integration.wisla-events.availability-heartbeat-enabled=${APP_INTEGRATION_WISLA_EVENTS_AVAILABILITY_HEARTBEAT_ENABLED:true}
app.integration.wisla-events.availability-heartbeat-ms=${APP_INTEGRATION_WISLA_EVENTS_AVAILABILITY_HEARTBEAT_MS:300000}

# Kafka fast-fail tuning
monitoring.kafka.listener-concurrency=${MONITORING_KAFKA_LISTENER_CONCURRENCY:6}
monitoring.kafka.publisher.send-timeout-ms=${MONITORING_KAFKA_PUBLISHER_SEND_TIMEOUT_MS:1500}
spring.kafka.producer.properties.max.request.size=${KAFKA_MAX_REQUEST_SIZE:2097152}
spring.kafka.consumer.properties.fetch.max.bytes=${KAFKA_FETCH_MAX_BYTES:4194304}
spring.kafka.producer.retries=${KAFKA_PRODUCER_RETRIES:2}
spring.kafka.producer.properties.request.timeout.ms=${KAFKA_REQUEST_TIMEOUT_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${KAFKA_DELIVERY_TIMEOUT_MS:12000}
spring.kafka.producer.compression-type=${KAFKA_COMPRESSION_TYPE:lz4}
spring.kafka.producer.batch-size=${KAFKA_BATCH_SIZE:131072}
spring.kafka.producer.properties.linger.ms=${KAFKA_LINGER_MS:25}
spring.kafka.producer.properties.buffer.memory=${KAFKA_BUFFER_MEMORY:134217728}
spring.kafka.producer.properties.max.in.flight.requests.per.connection=${KAFKA_MAX_IN_FLIGHT:5}
spring.kafka.producer.properties.retry.backoff.ms=${KAFKA_RETRY_BACKOFF_MS:200}
spring.kafka.producer.properties.reconnect.backoff.ms=${KAFKA_RECONNECT_BACKOFF_MS:500}
spring.kafka.producer.properties.reconnect.backoff.max.ms=${KAFKA_RECONNECT_BACKOFF_MAX_MS:5000}

spring.kafka.consumer.max-poll-records=${KAFKA_MAX_POLL_RECORDS:1000}
spring.kafka.consumer.properties.fetch.min.bytes=${KAFKA_FETCH_MIN_BYTES:1048576}
spring.kafka.consumer.properties.fetch.max.wait.ms=${KAFKA_FETCH_MAX_WAIT_MS:250}
spring.kafka.consumer.properties.max.partition.fetch.bytes=${KAFKA_MAX_PARTITION_FETCH_BYTES:4194304}
spring.kafka.consumer.properties.session.timeout.ms=${KAFKA_SESSION_TIMEOUT_MS:30000}
spring.kafka.consumer.properties.heartbeat.interval.ms=${KAFKA_HEARTBEAT_INTERVAL_MS:10000}
spring.kafka.consumer.properties.request.timeout.ms=${KAFKA_CONSUMER_REQUEST_TIMEOUT_MS:40000}
spring.kafka.consumer.properties.default.api.timeout.ms=${KAFKA_CONSUMER_API_TIMEOUT_MS:30000}
spring.kafka.consumer.properties.max.poll.interval.ms=${KAFKA_MAX_POLL_INTERVAL_MS:300000}
spring.kafka.consumer.properties.partition.assignment.strategy=${KAFKA_ASSIGNMENT_STRATEGY:org.apache.kafka.clients.consumer.CooperativeStickyAssignor}
spring.kafka.listener.poll-timeout=${KAFKA_LISTENER_POLL_TIMEOUT_MS:1500}

# In production, topics are expected to be provisioned externally.
spring.kafka.admin.auto-create=${KAFKA_ADMIN_AUTO_CREATE:false}

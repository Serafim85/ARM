# MVP stack — TimescaleDB for WISLA ARM
# Usage: docker compose -f infra/docker-compose.yml up -d

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: wisla-arm-timescaledb
    command:
      - postgres
      - -c
      - max_connections=250
    restart: unless-stopped
    environment:
      POSTGRES_DB: wisla_arm
      POSTGRES_USER: wisla_arm
      POSTGRES_PASSWORD: wisla_arm
    ports:
      - "5435:5432"
    volumes:
      - wisla-arm-timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisla_arm -d wisla_arm"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wisla-arm-timescaledb-data:
